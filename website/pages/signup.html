<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <h1 class="site-title">Movie Rating 🎬</h1>

    <div class="card">

        <h1>Sign Up</h1>
        <p>Create your account</p>

        <!-- MATCH TS IDs -->

        <input type="text" id="usernameInput" placeholder="Choose username" />

        <input type="password" id="passwordInput" placeholder="Choose password" />

        <input type="password" id="confirmInput" placeholder="Confirm password" />

        <button id="submitButton">Create Account</button>

        <div id="errorDiv"></div>

        <p class="switch">
            Have an account?
            <a href="login.html">Log in</a>
        </p>

    </div>

    <!-- חשוב: קודם clientUtilities ואז הקוד שלך -->
    <script type="module" src="signup.js"></script>

</body>

</html>
