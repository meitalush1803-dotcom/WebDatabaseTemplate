<!DOCTYPE html>
<!-- מציין שמדובר במסמך HTML5 -->

<html lang="he">
<!-- תגית השורש של העמוד, שפת האתר היא עברית -->

<head>

    <!-- מאפשר הצגת עברית ותווים מיוחדים -->
    <meta charset="UTF-8">

    <!-- הכותרת שמופיעה בלשונית הדפדפן -->
    <title>Add Movie</title>

    <!-- חיבור קובץ העיצוב של העמוד -->
    <link rel="stylesheet" href="add-movie.css">

    <!-- טעינת הפונט Poppins מגוגל -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- כותרת העמוד -->
    <h1 class="site-title">
        Add New Movie 🎬
    </h1>

    <!-- הטופס הראשי של הוספת סרט -->
    <main class="form-container">

        <!-- שדה להזנת שם הסרט -->
        <input
            type="text"
            id="title"
            placeholder="Movie Name"
        >

        <!-- שדה להזנת שם הבמאי -->
        <input
            type="text"
            id="director"
            placeholder="Director"
        >

        <!-- שדה להזנת שנת יציאת הסרט -->
        <input
            type="number"
            id="year"
            placeholder="Year"
        >

        <!-- שדה להזנת קישור לתמונת הסרט -->
        <input
            type="text"
            id="image"
            placeholder="Image URL"
        >

        <!-- שדה להזנת תיאור הסרט -->
        <textarea
            id="description"
            placeholder="Movie Description"
        ></textarea>

        <!-- אזור להצגת הודעות שגיאה או מידע -->
        <p id="message"></p>

        <!-- תצוגה מקדימה של תמונת הסרט -->
        <img
            id="previewImage"
            src=""
            alt=""
        >

        <!-- אזור הכפתורים -->
        <div class="buttons">

            <!-- שמירת הסרט במסד הנתונים -->
            <button
                onclick="saveMovie()"
                id="saveButton"
            >
                Save Movie
            </button>

            <!-- חזרה לעמוד הראשי ללא שמירה -->
            <button
                onclick="goBack()"
                id="backButton"
            >
                Back
            </button>

        </div>

    </main>

    <!-- טעינת קובץ TypeScript של העמוד -->
    <script
        type="module"
        src="add-movie.js"
    ></script>

</body>

</html>
