<!DOCTYPE html>
<html lang="he">

<head>
    <meta charset="UTF-8">

    <title>Add Movie</title>

    <link rel="stylesheet" href="add-movie.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <h1 class="site-title">
        Add New Movie 🎬
    </h1>

    <main class="form-container">

        <!-- שדה להזנת שם הסרט -->
        <input
            type="text"
            id="title"
            placeholder="Movie Name"
        >

        <!-- שדה להזנת שם הבמאי -->
        <input
            type="text"
            id="director"
            placeholder="Director"
        >

        <!-- שדה להזנת שנת יציאת הסרט -->
        <input
            type="number"
            id="year"
            placeholder="Year"
        >

        <!-- שדה להזנת קישור לתמונת הסרט -->
        <input
            type="text"
            id="image"
            placeholder="Image URL"
        >

        <!-- שדה להזנת תיאור הסרט -->
        <textarea
            id="description"
            placeholder="Movie Description"
        ></textarea>

        <p id="message"></p>

        <!-- תצוגה מקדימה של תמונת הסרט -->
        <img
            id="previewImage"
            src=""
            alt=""
        >

        <!-- כפתורי שמירה וחזרה -->
        <div class="buttons">

            <button onclick="saveMovie()" id="saveButton">
                Save Movie
            </button>

            <button onclick="goBack()" id="backButton">
                Back
            </button>

        </div>

    </main>
    
    <script type="module" src="add-movie.js"></script>

</body>

</html>
