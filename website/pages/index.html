<!DOCTYPE html>
<html lang="he">

<head>
    <meta charset="UTF-8">

    <title>Movie Rating</title>

    <link rel="stylesheet" href="index.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- החלק העליון של האתר -->
    <header>
        <h1 id="movierating">
            Movie Rating 🎬
        </h1>

        <div id="userSection">
            Welcome,
            <span id="usernameSpan"></span>

            <button id="logoutButton">
                Log out
            </button>
        </div>
    </header>

    <!-- כאן יוצגו כל הסרטים -->
    <main id="moviesContainer"></main>

    <!-- כפתור פלוס להוספת סרט חדש -->
    <button id="floatingButton">
        +
    </button>

    <!-- חלון ריק שנפתח כשלוחצים על תמונת הסרט -->
    <div id="movieModal">

        <div id="movieModalContent">

            <!-- כפתור לסגירת החלון -->
            <button id="closeModalButton">
                ×
            </button>

        </div>

    </div>

    <script type="module" src="index.js"></script>

</body>

</html>
