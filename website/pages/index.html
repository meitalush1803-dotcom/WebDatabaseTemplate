<!DOCTYPE html>
<html lang="he">

<head>
    <meta charset="UTF-8">

    <title>Movie Rating</title>

    <link rel="stylesheet" href="index.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1 id="movierating">
            Movie Rating 🎬
        </h1>

        <div id="userSection">
            Welcome,
            <span id="usernameSpan"></span>

            <button id="logoutButton">
                Log out
            </button>
        </div>
    </header>

    <!-- כפתורים שפותחים חלון של Favorites / Watch Later -->
    <div id="topButtons">
        <button id="favoritesButton" class="top-action-button">
            Favorites
        </button>

        <button id="watchLaterButton" class="top-action-button">
            Watch Later
        </button>
    </div>

    <main id="moviesContainer"></main>

    <button id="floatingButton">
        +
    </button>

    <!-- חלון קופץ -->
    <div id="movieModal">

        <div id="movieModalContent">

            <button id="closeModalButton">
                ×
            </button>

            <div id="movieModalDetails"></div>

        </div>

    </div>

    <script type="module" src="index.js"></script>

</body>

</html>
